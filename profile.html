    <script>
        const swiper = new Swiper('.member-slider', {
            loop: true, // Agar slider bisa berputar terus
            autoplay: {
                delay: 3000, // Waktu pindah otomatis: 3 detik
                disableOnInteraction: false, // Tetap auto-slide setelah interaksi user
            },
            
            // Mengatur jumlah slide yang terlihat berdasarkan lebar layar
            breakpoints: {
                // Perubahan: Tampilkan 3 kartu di layar mobile
                320: { 
                    slidesPerView: 3, 
                    spaceBetween: 15 
                },
                768: { 
                    slidesPerView: 3, 
                    spaceBetween: 30 
                },
                992: { 
                    slidesPerView: 4, 
                    spaceBetween: 30 
                },
                1200: { 
                    slidesPerView: 5, 
                    spaceBetween: 30 
                }
            },

            // Mengaktifkan tombol navigasi kiri-kanan
            navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev',
            },
        });
    </script>

    <script>
        // --- Script untuk Popover (Sudah ada) ---
        const popoverTriggerList = document.querySelectorAll('[data-bs-toggle="popover"]');
        const popoverList = [...popoverTriggerList].map(popoverTriggerEl => new bootstrap.Popover(popoverTriggerEl, {
            container: 'body'
        }));

        // --- BARU: Script untuk Scroll-to-Top ---
        const scrollTop = document.querySelector('.scroll-top');
        if (scrollTop) {
            const togglescrollTop = function() {
                window.scrollY > 100 ? scrollTop.classList.add('active') : scrollTop.classList.remove('active');
            }
            window.addEventListener('load', togglescrollTop);
            document.addEventListener('scroll', togglescrollTop);
            scrollTop.addEventListener('click', (e) => {
                e.preventDefault();
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
        }
    </script>
