<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genre Action - Game Store</title>
    <link href="assets/img/video-games-icon-png-9.jpg" rel="icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

    <div class="d-flex">
        <nav class="sidebar offcanvas-lg offcanvas-start p-3 bg-dark" tabindex="-1">
            <div class="offcanvas-body d-flex flex-column p-0">
                <ul class="nav nav-pills flex-column mb-auto">
                    <li class="nav-item"><a href="index.html" class="nav-link"><i class="bi bi-house"></i></a></li>
                    <li class="nav-item"><a href="kategori.html" class="nav-link active"><i class="bi bi-grid"></i></a></li>
                    <li><a href="profile.html" class="nav-link"><i class="bi bi-person"></i></a></li>
                </ul>
            </div>
        </nav>

        <main class="content-area p-4">
            <header class="d-flex align-items-center gap-3 mb-4">
                <a href="kategori.html" class="btn btn-outline-light me-2"><i class="bi bi-arrow-left"></i></a>
                <h1 class="h4 mb-0">Genre: Action</h1>
                <div class="input-group search-bar-wrapper flex-grow-1 ms-3">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="text" class="form-control search-bar" placeholder="Cari game action...">
                </div>
            </header>

            <section>
                <div class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-4" id="game-list">
                    <div class="col">
                        <div class="card game-card h-100">
                            <img src="assets/img/app/ff.jpg" class="card-img-top" alt="Free Fire">
                            <div class="card-body">
                                <h5 class="card-title">Garena Free Fire</h5>
                            </div>
                        </div>
                    </div>
                    <div class="col">
                        <div class="card game-card h-100">
                            <img src="assets/img/app/pubg.png" class="card-img-top" alt="PUBG">
                            <div class="card-body">
                                <h5 class="card-title">PUBG Mobile</h5>
                            </div>
                        </div>
                    </div>
                    </div>
            </section>
        </main>
    </div>

    <nav class="mobile-bottom-nav d-lg-none">
        <a href="index.html" class="nav-link"><i class="bi bi-house"></i><span>Beranda</span></a>
        <a href="kategori.html" class="nav-link active"><i class="bi bi-grid"></i><span>Kategori</span></a>
        <a href="profile.html" class="nav-link"><i class="bi bi-person"></i><span>Profil</span></a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 1. Fitur Pencarian Lokal
            const searchInput = document.querySelector('.search-bar');
            const cards = document.querySelectorAll('.game-card');
            
            searchInput.addEventListener('input', function() {
                const query = this.value.toLowerCase();
                cards.forEach(card => {
                    const title = card.querySelector('.card-title').textContent.toLowerCase();
                    card.closest('.col').style.display = title.includes(query) ? '' : 'none';
                });
            });

            // 2. Fitur Klik Buka Play Store
            cards.forEach(card => {
                card.style.cursor = 'pointer';
                card.addEventListener('click', (e) => {
                    if (e.target.closest('a')) return;
                    const title = card.querySelector('.card-title').textContent.trim();
                    window.open(`https://play.google.com/store/search?q=${encodeURIComponent(title)}&c=apps`, '_blank');
                });
            });
        });
    </script>
</body>
</html>
