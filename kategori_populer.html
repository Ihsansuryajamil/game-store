    <script>
        // Klik kartu membuka Play Store search berdasarkan nama aplikasi
        document.querySelectorAll('.game-card').forEach(card => {
            card.addEventListener('click', (e) => {
                if (e.target.closest('a') || e.target.closest('button')) return;
                const titleEl = card.querySelector('.card-title');
                if (!titleEl) return;
                const q = encodeURIComponent(titleEl.textContent.trim());
                const url = `https://play.google.com/store/search?q=${q}&c=apps`;
                window.open(url, '_blank', 'noopener');
            });
        });
    </script>
    <script>
        // Search bar: tekan Enter atau klik ikon untuk membuka Play Store search
        (function(){
            const input = document.querySelector('.search-bar');
            const btn = document.querySelector('.search-bar-wrapper .input-group-text');
            function doSearch(q){
                q = (q||'').trim();
                if(!q) return;
                const url = 'https://play.google.com/store/search?q=' + encodeURIComponent(q) + '&c=apps';
                window.open(url, '_blank', 'noopener');
            }
            if(input){
                input.addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); doSearch(input.value); } });
            }
            if(btn){ btn.addEventListener('click', ()=> doSearch(input && input.value)); }
        })();
    </script>

    <script>
        // --- Script untuk Popover (Sudah ada) ---
        const popoverTriggerList = document.querySelectorAll('[data-bs-toggle="popover"]');
        const popoverList = [...popoverTriggerList].map(popoverTriggerEl => new bootstrap.Popover(popoverTriggerEl, {
            container: 'body'
        }));

        // --- BARU: Script untuk Scroll-to-Top ---
        const scrollTop = document.querySelector('.scroll-top');
        if (scrollTop) {
            const togglescrollTop = function() {
                window.scrollY > 100 ? scrollTop.classList.add('active') : scrollTop.classList.remove('active');
            }
            window.addEventListener('load', togglescrollTop);
            document.addEventListener('scroll', togglescrollTop);
            scrollTop.addEventListener('click', (e) => {
                e.preventDefault();
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
        }
    </script>
